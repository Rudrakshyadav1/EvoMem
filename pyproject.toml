[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evomem"
version = "0.1.0"
description = "Validated, retrieval-gated experience memory for coding agents"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
evomem = "evomem.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
